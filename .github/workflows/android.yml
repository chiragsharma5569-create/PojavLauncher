
name: RubicLauncher Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - v3_openjdk

permissions:
  contents: write

jobs:
  build:
    name: Build RubicLauncher APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download LTW
        run: |
          wget -q -O app_pojavlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Prepare build files
        run: |
          chmod +x gradlew
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk \
            out/RubicLauncher.apk

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: RubicLauncher-build-${{ github.run_number }}
          name: RubicLauncher Build ${{ github.run_number }}
          files: out/RubicLauncher.apk
          generate_release_notes: true
